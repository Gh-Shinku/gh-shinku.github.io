{{ define "main" }}

<div class="post-layout">
    <article class="post-content">
        <h1 class="post-title">{{ .Title }}</h1>
        {{ .Content }}
    </article>

    {{ if and .IsPage (or .Params.toc $.Site.Params.toc) }}
    <aside class="post-toc {{ if or .Params.tocBorder $.Site.Params.tocBorder }}with-border{{ end }}">
        <button class="toc-toggle" type="button" aria-expanded="true" aria-controls="TableOfContents">
            <span>Contents</span>
            <span class="toc-toggle-icon" aria-hidden="true">−</span>
        </button>
        <div class="toc-panel">
            {{ .TableOfContents }}
        </div>
    </aside>
    {{ end }}
</div>

<dialog class="image-lightbox" aria-label="Image preview">
    <button class="image-lightbox-close" type="button" aria-label="Close image preview">×</button>
    <img src="" alt="">
    <p class="image-lightbox-caption"></p>
</dialog>

{{ $postScript := resources.Get "js/post.js" | minify | fingerprint }}
<script defer src="{{ $postScript.RelPermalink }}" integrity="{{ $postScript.Data.Integrity }}"></script>

{{ end }}
